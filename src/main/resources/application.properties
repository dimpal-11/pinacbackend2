spring.application.name=pinacweb1
server.port=8080
server.address=0.0.0.0

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Razorpay
razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}

# Brevo SMTP
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${APP_MAIL_FROM}
app.mail.support-email=support@pinacinstitute.com
app.mail.support-phone=+91 7219194211

# Brevo SMS
brevo.api.key=${BREVO_API_KEY}
brevo.sms.sender=PINAC
brevo.sms.url=https://api.brevo.com/v3/transactionalSMS/send

# Institute
app.institute.name=PINACXTREME
app.institute.tagline=Learn Today. Build Tomorrow.
app.institute.website=${APP_WEBSITE}

# Google Sheets
google.credentials.path=classpath:google/credentials.json
google.sheets.enabled=true
google.sheets.spreadsheet-id=${GOOGLE_SHEETS_SPREADSHEET_ID}
google.sheets.sheet-name=Sheet1
google.sheets.student-sheet-name=Students
google.sheets.payment-sheet-name=Payments
google.sheets.enrollment-sheet-name=Enrollments
google.sheets.webhook-url=${GOOGLE_SHEETS_WEBHOOK_URL}

# WhatsApp
whatsapp.api.url=https://graph.facebook.com/v20.0
whatsapp.api.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID}
whatsapp.api.business-account-id=${WHATSAPP_BUSINESS_ACCOUNT_ID}
whatsapp.api.access-token=${WHATSAPP_ACCESS_TOKEN}
whatsapp.api.verify-token=${WHATSAPP_VERIFY_TOKEN}
whatsapp.api.institute-phone=${WHATSAPP_INSTITUTE_PHONE}

# Gemini
whatsapp.ai.enabled=true
whatsapp.ai.gemini-api-key=${GEMINI_API_KEY}
whatsapp.ai.model=gemini-1.5-flash

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.listener.simple.auto-startup=false

whatsapp.rabbitmq.queue=whatsapp.incoming.messages
whatsapp.rabbitmq.exchange=whatsapp.direct.exchange
whatsapp.rabbitmq.routing-key=whatsapp.message.key
whatsapp.rabbitmq.enabled=false